apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformpilot
  namespace: platformpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platformpilot
  template:
    metadata:
      labels:
        app: platformpilot
    spec:
      containers:
        - name: platformpilot
          image: platformpilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
